<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>Social Media Selector</title>
</head>

<body>
    <div class="hero">
        <div class="selector">
            <div class="" id="selectField">
                <p>Select Social Media</p>
                <img src="./SelectMenu_Img/arrow.png" alt="">
            </div>
            <ul id="list">
                <li class="options">
                    <img src="./SelectMenu_Img/facebook.png" alt="">
                    <p>facebook</p>
                </li>
                <li class="options">
                    <img src="./SelectMenu_Img/youtube.png" alt="">
                    <p>youtube</p>
                </li>
                <li class="options">
                    <img src="./SelectMenu_Img/instagram.png" alt="">
                    <p>instagram</p>
                </li>
                <li class="options">
                    <img src="./SelectMenu_Img/twitter.png" alt="">
                    <p>twitter</p>
                </li>
                <li class="options">
                    <img src="./SelectMenu_Img/whatsapp.png" alt="">
                    <p>whatsapp</p>
                </li>
                <li class="options">
                    <img src="./SelectMenu_Img/pinterest.png" alt="">
                    <p>pinterest</p>
                </li>
            </ul>
        </div>
    </div>
    <script src="./script.js"></script>
</body>

</html>
