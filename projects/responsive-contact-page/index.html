<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <link rel="stylesheet" href="./style.css">
   <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <title>Responsive Contact Page</title>
</head>
<body>
<div class="container">
    <div class="content">
        <div class="left-side">
            <div class="address details">
<i class="fas fa-map-marker-alt"></i>
<div class="topic">Address</div>
<div class="text-one">Lorem, ipsum.</div>
<div class="text-two">Lorem, ipsum dolor.</div>
            </div>
            <div class="phone details">
<i class="fas fa-phone-alt"></i>
<div class="topic">Phone</div>
<div class="text-one">03121751037</div>
<div class="text-two">03256111104</div>
            </div>
            <div class="email details">
<i class="fas fa-envelope"></i>
<div class="topic">Email</div>
<div class="text-one">example1@gmail.com</div>
<div class="text-two">example2@gmail.com</div>
            </div>
        </div>
        <div class="right-side">    
            <div class="topic-text">Send us a message</div>
            <p>Lorem ipsum dolor sit amet consectetur, adipisicing elit. Impedit optio deserunt officiis consectetur fugiat facilis!</p>
       
        <form action="#">
            <div class="input-box">
                <input type="text" name="name" placeholder="Enter Your Name Here" aria-label="Your name">
            </div>
            <div class="input-box">
                <input type="email" name="email" placeholder="Enter Your Email Here" aria-label="Your email">
            </div>
            <div class="input-box message-box">
                <textarea name="message" id="message" placeholder="Enter Your Message Here" aria-label="Your message"></textarea>
            </div>
            <div class="button">
                <input type="submit" value="Send Now">
            </div>
        </form>
        </div>
    </div>
</div>


    
</body>
</html>
