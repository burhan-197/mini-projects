<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>Responsive Login Form</title>
</head>
<body>
<div class="container">
    <form action="#">
<div class="title"> Login </div>
<div class="input-box">
<input type="email" name="email" placeholder="Enter Your Email" aria-label="Email" required>
<div class="underline"></div>
</div>
<div class="input-box">
<input type="password" name="password" placeholder="Enter Your Password" aria-label="Password" required>
<div class="underline"></div>
</div>
<div class="input-box button">
<input type="submit" value="Continue">
</div>
</form>
<div class="option">or Connect with Social Media</div>
<div class="twitter">
    <a href="#"><i class="fab fa-twitter"></i>Login With Twitter</a>
</div>
<div class="facebook">
    <a href="#"><i class="fab fa-facebook-f"></i>Login With Facebook</a>
</div>
</div>
    




</body>
</html>
