<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="./style.css">
    <title>Responsive Sidebar</title>
</head>
<body>
    <div class="main-box">
        <input type="checkbox" id="check">
        <div class="btn-one">
            <label for="check">
                <i class="fas fa-bars"></i>
            </label> 
        </div>
        <div class="sidebar-menu">
            <div class="logo">
                <a href="#">Demo User</a>
            </div>
            <div class="btn-two">
                <label for="check">
                    <i class="fas fa-times"></i>
                </label>
            </div>
            <div class="menu">
                <ul>
                    <li><a href="#"><i class="fas fa-qrcode"></i> Dashboard</a></li>
                    <li><a href="#"><i class="fas fa-link"></i> Shortcuts</a></li>
                    <li><a href="#"><i class="fas fa-stream"></i> Overview</a></li>
                    <li><a href="#"><i class="fas fa-calendar"></i> Events</a></li>
                    <li><a href="#"><i class="fas fa-question"></i> About</a></li>
                    <li><a href="#"><i class="fas fa-sliders"></i> Services</a></li>
                    <li><a href="#"><i class="fas fa-phone"></i> Contacts</a></li>
                    <li><a href="#"><i class="fas fa-comment"></i> Feedback</a></li>
                </ul>
            </div>
            <div class="social-media">
                <a href="#" aria-label="Facebook"><i class="fab fa-facebook-f"></i></a>
                <a href="#" aria-label="Twitter"><i class="fab fa-twitter"></i></a>
                <a href="#" aria-label="YouTube"><i class="fab fa-youtube"></i></a>
                <a href="#" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
            </div>
        </div>
    </div>
</body>
</html>
