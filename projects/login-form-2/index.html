<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>Login Form 2</title>
</head>
<body>
<div class="login">
<img src="./wp4796222-aesthetic-computer-japanese-wallpapers.jpg" alt="Japanese aesthetic computer wallpaper">
<form action="#" class="login-form">
    <h1 class="title">
        Login
    </h1>
    <div class="login-inputs">
        <div class="login-box">
            <input type="email" placeholder="" id="email" class="login-input" required>
            <label for="email" class="login-label">Email Id</label>
<i class="fa-solid fa-envelope"></i>
        </div>
        <div class="login-box">
            <input type="password" placeholder="" id="password" class="login-input" required>
            <label for="password" class="login-label">Password</label>
            <i class="fa-solid fa-lock"></i>
        </div>
    </div>
    <div class="login-check">
        <div class="login-check-box">
            <input type="checkbox" id="user-check" class="login-check-input">
            <label for="user-check">Remember Me</label>
        </div>
        <a href="#" class="login-forgot">Forgot Password</a>
    </div>
    <button type="submit" class="login-button">Login</button>
    <div class="login-register">
        Don't have an account? <a href="#">Register</a>
    </div>
</form>
</div>
    
</body>
</html>
