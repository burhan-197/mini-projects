<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>Toast Notifications</title>
</head>

<body>
    <div class="buttons">
        <button onclick="showToast('Successfully Submitted', 'success')" class="btn btn-success">Success</button>
        <button onclick="showToast('Please fill all the fields', 'error')" class="btn btn-error">Error</button>
        <button onclick="showToast('Warning fill all the fields', 'warning')" class="btn btn-warning">Warning</button>
    </div>

    <div class="toastbox" id="toastbox"></div>

    <script src="./script.js"></script>
</body>

</html>
