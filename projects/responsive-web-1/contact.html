<section class="contact-form">
<div class="container">
    <div class="form-wrapper">
<div class="address">
<div class="address-group">
    <i class="fas fa-map-marker-alt fa-3x"></i>
    <h2>Location</h2>
    <p>Lorem, ipsum.</p>
</div>
<div class="address-group">
    <i class="far fa-envelope fa-3x"></i>
    <h2>E-mail</h2>
    <p>Lorem, ipsum.</p>
</div>
<div class="address-group">
    <i class="fas fa-phone-square-alt fa-3x"></i>
    <h2>Phone</h2>
    <p>Lorem, ipsum.</p>
</div>
<img src="./img/istockphoto-1165384568-612x612.jpg" alt="City buildings">
</div>
<form action="" class="form">
    <h1>Contact Us</h1>
    <p>Lorem, ipsum dolor sit amet consectetur adipisicing elit. Quisquam, facere!</p>
    <div class="form-group">
        <label for="username">Username</label >
        <input type="text" name="username" id="username" required>
    </div>
    <div class="form-group">
        <label for="E-mail">E-mail</label >
        <input type="email" name="email" id="E-mail" required>
    </div>
    <div class="form-group">
        <label for="Phone">Phone</label >
        <input type="tel" name="phone" id="Phone" required>
    </div>
    <div class="form-group">
        <label for="Message">Message</label >
        <textarea name="message" id="Message" ></textarea>
    </div>
    <button type="submit" class="form-button">Submit</button>
</form>

    </div>
    </div>
