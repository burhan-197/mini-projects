<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&display=swap"
        rel="stylesheet">
    <title>To-Do List</title>
</head>

<body>
    <main>
        <h1 class="heading">Focus On <span>Today</span></h1>
        <div class="container">
            <div class="sub-content">
                <h2 class="day-heading">Today</h2>

                <div class="sun-icon-container">
                    <img src="./front.svg" alt="Sun rays" class="sun-icon-front">
                    <img src="./face.svg" alt="Sun face" class="sun-icon-face">
                </div>
            </div>
            <p class="para">Raise the bar by completing your goals!</p>
            <div class="progress-bar">
                <div class="progress"><span>0/3 completed</span></div>
                <p class="error-label">Please set all the 3 goals!</p>
            </div>

            <div class="goal-section ">
                <div class="check-box">
                    <img src="./tick.svg" alt="" class="check-icon">
                </div>
                <input id="first" class="goal-input" placeholder="Add new Goal...">
            </div>
            <div class="goal-section">
                <div class="check-box">
                    <img src="./tick.svg" alt="" class="check-icon">
                </div>
                <input id="second" type="text" class="goal-input" placeholder="Add new Goal...">
            </div>
            <div class="goal-section">
                <div class="check-box">
                    <img src="./tick.svg" alt="" class="check-icon">
                </div>
                <input id="third" type="text" class="goal-input" placeholder="Add new Goal...">
            </div>
            <p class="foot">“Move one step ahead, today!”</p>
        </div>

    </main>

    <script src="./script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
</body>

</html>
