<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>Secure Password Generator</title>
</head>

<body>
    <div class="container">
        <div class="content">
            <h1>Generate a <br><span>Secure Password</span></h1>
            <p class="subtitle">Create strong, random passwords instantly</p>

            <div class="display">
                <input type="text" id="Password" placeholder="Your password will appear here" readonly>
                <button class="copy-btn" title="Copy password">
                    <img src="./images/copy.png" alt="Copy">
                </button>
            </div>

            <button class="Generate">
                <img src="./images/generate.png" alt="">
                Generate Password
            </button>
        </div>
    </div>

    <script src="./script.js"></script>
</body>

</html>
