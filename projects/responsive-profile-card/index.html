<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Profile Card</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg==" crossorigin="anonymous" referrerpolicy="no-referrer" />

</head>
<body>
    
<div class="profile-card">
    <div class="image">
        <img src="./img/male-photo1.jpg" alt="Profile portrait" class="profile-img">
    </div> 
    <div class="text-data">
        <span class="name">Demo User</span>
        <span class="job">Web Dev & Digital Marketer</span>
    </div>
    <div class="media-buttons">
        <a href="#" style="background-color:#4267b2 ;" class="link">
            <i class="fa-brands fa-facebook-f"></i>       
         </a>
        <a href="#" style="background-color:#1da1f2 ;" class="link">
            <i class="fa-brands fa-twitter"></i>       
         </a>
        <a href="#" style="background-color:#e1306c ;" class="link">
            <i class="fa-brands fa-instagram"></i>       
         </a>
        <a href="#" style="background-color:#ff0000 ;" class="link">
            <i class="fa-brands fa-youtube"></i>       
         </a>
    </div>
    <div class="buttons">
        <button class="button">Subscribe</button>
        <button class="button">Message</button>
    </div>
    <div class="analytics">
        <div class="data">
            <i class="fa-solid fa-heart"></i>
            <span class="number">60k</span>
        </div>
        <div class="data">
            <i class="fa-regular fa-message"></i>           
             <span class="number">10k</span>
        </div>
        <div class="data">
            <i class="fa-solid fa-share"></i>
            <span class="number">2k</span>
        </div>
    </div>
</div>



</body>
</html>
