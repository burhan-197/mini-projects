<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <link
        href="https://fonts.googleapis.com/css?family=Poppins:100,100italic,200,200italic,300,300italic,regular,italic,500,500italic,600,600italic,700,700italic,800,800italic,900,900italic"
        rel="stylesheet" />
    <title>Hamburger Web</title>
</head>

<body>

    <header>
        <div class="nav-bar  ">
            <div class="logo">
                <img src="./foodie hamburger logo.png" alt="">
            </div>
            <div class="hamburger-container">
                <div class="hamburger-menu">
                    <span class="hamburger-icon">&#9776;</span>
                </div>
            </div>
            <nav>
                <ul>
                    <span class="cross">&times;</span>
                    <li><a href="#top-picks">Top Picks</a></li>
                    <li><a href="#Whoppers">Whoppers</a></li>
                    <li><a href="#stunner-menu">Stunner Menu</a></li>
                    <li><a href="#new-foodie-collection">New Foodie Collection</a></li>
                    <li><a href="#deal-of-the-day">Deal of the Day</a></li>
                </ul>
            </nav>

        </div>
    </header>

    <section class="section1">
        <div class="section1-carosel">
            <img src="./burger 1.png" alt="">
            <img src="./burger 2.png" alt="">
            <img src="./burger 3.png" alt="">
            <img src="./burger 4.png" alt="">
            <img src="./burger 5.png" alt="">
        </div>
        <div class="section1-text">
            <p>Well, You can’t resist anymore!</p>
        </div>
    </section>
    <section id="top-picks" class="section2">
        <div class="section2-text">
            <h2>Top Picks</h2>
        </div>
        <div class="section2-img">
            <img src="./toppick.png" alt="">
        </div>
    </section>
    <section id="Whoppers" class="section3">
        <div class="section3-text">
            <h2>Whoppers</h2>
        </div>
        <div class="section3-img">
            <img src="./whopper.png" alt="">
        </div>
    </section>
    <section id="stunner-menu" class="section4">
        <div class="section4-text">
            <h2>Stunner Menu</h2>
        </div>
        <div class="section4-img">
            <img src="./stunner menu.png" alt="">
        </div>
    </section>
    <section id="deal-of-the-day" class="section5">
        <div class="section5-text">
            <h2>Deal of the Day</h2>
        </div>
        <div class="section5-img">
            <img src="./dealoftheday.png" alt="">
        </div>
        <div class="section5-top">
            <a href="#">Back To Top</a>
        </div>
    </section>

    <script src="./script.js"></script>
</body>

</html>
