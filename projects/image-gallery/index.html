<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Josefin+Sans:wght@100;300&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
    <title>Image Gallery</title>
</head>

<body>

    <div class="noise"></div>

    <header class="site-header">
        <span class="header-label">CURATED</span>
        <h1 class="site-title">Visual <em>Archive</em></h1>
        <span class="header-label">2025</span>
    </header>

    <div class="gallery-wrap">
        <img src="./images/back.png" alt="Previous" id="backBtn">
        <div class="gallery">
            <div>
                <span><img src="./images/1.jpeg" alt=""></span>
                <span><img src="./images/2.jpeg" alt=""></span>
                <span><img src="./images/3.jpeg" alt=""></span>
            </div>
            <div>
                <span><img src="./images/4.jpeg" alt=""></span>
                <span><img src="./images/5.jpeg" alt=""></span>
                <span><img src="./images/6.jpeg" alt=""></span>
            </div>
        </div>
        <img src="./images/next.png" alt="Next" id="nextBtn">
    </div>

    <footer class="site-footer">
        <div class="footer-line"></div>
        <span class="footer-text">Scroll to explore</span>
    </footer>

    <script src="./script.js"></script>
</body>

</html>
